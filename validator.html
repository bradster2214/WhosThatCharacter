<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhosThatCharacter — Validator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f1a; color: #e0e0e0; font-family: monospace; font-size: 14px; padding: 32px; max-width: 900px; }

    h1 { color: #fff; font-size: 20px; margin-bottom: 4px; }
    .subtitle { color: #666; margin-bottom: 28px; }

    .actions { display: flex; gap: 10px; margin-bottom: 24px; }
    button {
      background: #1e1e3a; border: 1px solid #444; color: #e0e0e0;
      padding: 8px 18px; cursor: pointer; font-family: monospace; font-size: 14px;
      border-radius: 4px;
    }
    button:hover { background: #2a2a4a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .status { color: #666; font-style: italic; margin-bottom: 20px; min-height: 18px; }

    .summary {
      background: #1a1a2e; border: 1px solid #333; border-radius: 4px;
      padding: 12px 16px; margin-bottom: 20px; line-height: 1.6;
    }
    .summary .ok  { color: #4caf50; }
    .summary .bad { color: #f44336; }
    .summary .dim { color: #888; }

    .section { margin-bottom: 16px; }
    .section-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 4px 4px 0 0;
      font-weight: bold; font-size: 13px;
    }
    .section-header.pass { background: #1a2e1a; color: #4caf50; border: 1px solid #2a4a2a; }
    .section-header.fail { background: #2e1a1a; color: #f44336; border: 1px solid #4a2a2a; }
    .section-header.warn { background: #2e2210; color: #ff9800; border: 1px solid #4a3a10; }

    .issues {
      border: 1px solid #333; border-top: none; border-radius: 0 0 4px 4px;
      overflow: hidden;
    }
    .issue {
      padding: 6px 12px; border-bottom: 1px solid #222;
      color: #ccc; word-break: break-all; line-height: 1.5;
    }
    .issue:last-child { border-bottom: none; }
    .issue.error { border-left: 3px solid #f44336; }
    .issue.warn  { border-left: 3px solid #ff9800; }
  </style>
</head>
<body>

  <h1>WhosThatCharacter — Validator</h1>
  <div class="subtitle">Checks your character list and image folder for issues before going live.</div>

  <div id="status" class="status">Loading…</div>

  <div class="actions">
    <button id="rerunBtn" onclick="runChecks()" disabled>Re-run checks</button>
  </div>

  <div id="results"></div>

  <script>
  "use strict";

  // ---------------------------------------------------------------------------
  // Config loading — mirrors app.js
  // ---------------------------------------------------------------------------

  function stripJsonComments(str) {
    return str
      .replace(/\/\/[^\n]*/g, "")
      .replace(/\/\*[\s\S]*?\*\//g, "");
  }

  async function loadJson(path, optional = false) {
    try {
      const r = await fetch(path);
      if (!r.ok) { if (optional) return null; throw new Error(`HTTP ${r.status} loading ${path}`); }
      return JSON.parse(stripJsonComments(await r.text()));
    } catch (e) {
      if (optional) return null;
      throw e;
    }
  }

  function deepMerge(base, override) {
    const result = Object.assign({}, base);
    for (const key of Object.keys(override)) {
      if (override[key] !== null && typeof override[key] === "object" && !Array.isArray(override[key]) &&
          typeof base[key] === "object" && base[key] !== null && !Array.isArray(base[key])) {
        result[key] = deepMerge(base[key], override[key]);
      } else {
        result[key] = override[key];
      }
    }
    return result;
  }

  // ---------------------------------------------------------------------------
  // Character list parsing — mirrors app.js
  // ---------------------------------------------------------------------------

  function normalizeGuess(text) {
    return String(text).toLowerCase().trim()
      .replace(/['']/g, "").replace(/[-_]/g, " ")
      .replace(/[^\p{L}\p{N}\s]/gu, "").replace(/\s+/g, " ").trim();
  }

  function parseCharacterList(text) {
    return text.split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l && !l.startsWith("#"))
      .map(line => {
        const parts = line.split("|").map(p => p.trim()).filter(p => p.length > 0);
        if (!parts.length) return null;
        const canonicalName = parts[0];
        const literalAliases = [];
        const regexAliases   = [];
        const badRegex       = [];
        for (const part of parts) {
          if (/^\/.*\/[gimsuy]*$/.test(part)) {
            // Looks like a regex — try to compile it
            const m = part.match(/^\/(.+)\/([gimsuy]*)$/);
            try {
              regexAliases.push(new RegExp(m[1], m[2]));
            } catch (_) {
              badRegex.push(part);
            }
          } else {
            literalAliases.push(part);
          }
        }
        return { canonicalName, normalizedAliases: literalAliases.map(normalizeGuess), regexAliases, badRegex };
      })
      .filter(Boolean);
  }

  // ---------------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------------

  function renderSection(title, items, type, emptyMsg) {
    const section = document.createElement("div");
    section.className = "section";

    const header = document.createElement("div");
    if (items.length === 0) {
      header.className = "section-header pass";
      header.textContent = `✓  ${title} — ${emptyMsg}`;
    } else {
      header.className = `section-header ${type === "error" ? "fail" : "warn"}`;
      header.textContent = `✗  ${title} — ${items.length} issue${items.length !== 1 ? "s" : ""}`;
    }
    section.appendChild(header);

    if (items.length > 0) {
      const list = document.createElement("div");
      list.className = "issues";
      for (const item of items) {
        const el = document.createElement("div");
        el.className = `issue ${type}`;
        el.textContent = item;
        list.appendChild(el);
      }
      section.appendChild(list);
    }

    return section;
  }

  // ---------------------------------------------------------------------------
  // Main checks
  // ---------------------------------------------------------------------------

  async function runChecks() {
    document.getElementById("rerunBtn").disabled = true;
    document.getElementById("status").textContent = "Running checks…";
    document.getElementById("results").innerHTML = "";

    try {
      // Load config
      const base  = await loadJson("config.json");
      const local = await loadJson("config.local.json", true);
      const cfg   = local ? deepMerge(base, local) : base;

      const charPath    = cfg.files?.characterList    || "characters.txt";
      const imageFolder = cfg.files?.imageFolder      || "images";
      const imageExt    = (cfg.files?.imageExtension  || "png").toLowerCase();
      const placeholder = (cfg.files?.placeholderImage || "images/placeholder.png").split("/").pop();

      // Load character list
      const charResp = await fetch(charPath);
      if (!charResp.ok) throw new Error(`Could not load ${charPath} — is the server running?`);
      const characters = parseCharacterList(await charResp.text());

      // Load image list from server endpoint
      const imgResp  = await fetch(`/list-images?folder=${encodeURIComponent(imageFolder)}`);
      const imgFiles = imgResp.ok ? await imgResp.json() : [];

      // ------------------------------------------------------------------
      // Check 1 — Missing images (character has no image file)
      // ------------------------------------------------------------------
      const missingImages = [];
      for (const char of characters) {
        const expected = `${char.canonicalName}.${imageExt}`;
        if (!imgFiles.includes(expected)) {
          missingImages.push(`${char.canonicalName}  →  expected ${imageFolder}/${expected}`);
        }
      }

      // ------------------------------------------------------------------
      // Check 2 — Orphaned images (image file has no character entry)
      // ------------------------------------------------------------------
      const characterFilenames = new Set(
        characters.map(c => `${c.canonicalName}.${imageExt}`)
      );
      const orphaned = imgFiles
        .filter(f => f !== placeholder)
        .filter(f => !characterFilenames.has(f))
        .map(f => `${imageFolder}/${f}  →  no matching entry in ${charPath}`);

      // ------------------------------------------------------------------
      // Check 3 — Duplicate canonical names and aliases
      // ------------------------------------------------------------------
      const dupIssues = [];
      const nameSeen  = new Map();
      const aliasSeen = new Map();

      for (const char of characters) {
        if (nameSeen.has(char.canonicalName)) {
          dupIssues.push(`Duplicate canonical name: "${char.canonicalName}"`);
        }
        nameSeen.set(char.canonicalName, true);

        for (const alias of char.normalizedAliases) {
          if (aliasSeen.has(alias) && aliasSeen.get(alias) !== char.canonicalName) {
            dupIssues.push(`Alias "${alias}" — shared by "${aliasSeen.get(alias)}" and "${char.canonicalName}"`);
          } else {
            aliasSeen.set(alias, char.canonicalName);
          }
        }
      }

      // ------------------------------------------------------------------
      // Check 4 — Invalid regex aliases
      // ------------------------------------------------------------------
      const badRegexIssues = [];
      for (const char of characters) {
        for (const rx of char.badRegex) {
          badRegexIssues.push(`"${char.canonicalName}"  →  invalid regex: ${rx}`);
        }
      }

      // ------------------------------------------------------------------
      // Render
      // ------------------------------------------------------------------
      const results     = document.getElementById("results");
      const totalIssues = missingImages.length + orphaned.length + dupIssues.length + badRegexIssues.length;
      const checkedImages = imgFiles.filter(f => f !== placeholder).length;

      const summary = document.createElement("div");
      summary.className = "summary";
      if (totalIssues === 0) {
        summary.innerHTML =
          `<span class="ok">✓ All checks passed.</span>  ` +
          `<span class="dim">${characters.length} characters · ${checkedImages} images</span>`;
      } else {
        summary.innerHTML =
          `<span class="bad">✗ ${totalIssues} issue${totalIssues !== 1 ? "s" : ""} found.</span>  ` +
          `<span class="dim">${characters.length} characters · ${checkedImages} images</span>`;
      }
      results.appendChild(summary);

      results.appendChild(renderSection("Missing images",        missingImages,    "error", "all characters have an image"));
      results.appendChild(renderSection("Orphaned images",       orphaned,         "warn",  "no orphaned images"));
      results.appendChild(renderSection("Duplicate aliases",     dupIssues,        "error", "no duplicates"));
      results.appendChild(renderSection("Invalid regex aliases", badRegexIssues,   "error", "all regex aliases are valid"));

      document.getElementById("status").textContent = `Last checked: ${new Date().toLocaleTimeString()}`;

    } catch (e) {
      document.getElementById("status").textContent = `Error: ${e.message}`;
    }

    document.getElementById("rerunBtn").disabled = false;
  }

  window.addEventListener("DOMContentLoaded", runChecks);
  </script>
</body>
</html>
